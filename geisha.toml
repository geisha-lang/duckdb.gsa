name = "duckdb"
version = "0.1.0"
src_dir = "src"
tests = ["tests/spec.gsa"]

[target.native]
c_sources = ["native/gs_duckdb.c"]

[[target.native.when]]
os = "macos"
c_flags = ["-I/opt/homebrew/opt/duckdb/include", "-I/usr/local/opt/duckdb/include"]
link_flags = ["-L/opt/homebrew/opt/duckdb/lib", "-Wl,-rpath,/opt/homebrew/opt/duckdb/lib", "-L/usr/local/opt/duckdb/lib", "-lduckdb"]

[[target.native.when]]
os = "linux"
c_flags = ["-I/usr/local/include"]
link_flags = ["-L/usr/local/lib", "-Wl,-rpath,/usr/local/lib", "-lduckdb"]
